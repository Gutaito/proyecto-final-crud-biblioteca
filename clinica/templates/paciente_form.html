{% extends 'base.html' %}

{% block title %}Paciente - Clínica Central{% endblock %}

{% block content %}
<div class="form-card">
    <h2>{{ 'Editar paciente' if paciente else 'Registrar paciente' }}</h2>

    <form method="POST">
        <label for="dni">DNI</label>
        <input type="text" id="dni" name="dni" required
               value="{{ paciente.dni if paciente else '' }}">

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required
               value="{{ paciente.nombre if paciente else '' }}">

        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" required
               value="{{ paciente.apellido if paciente else '' }}">

        <label for="fecha_nacimiento">Fecha de nacimiento</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento"
               value="{{ paciente.fecha_nacimiento if paciente and paciente.fecha_nacimiento else '' }}">

        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono" name="telefono"
               value="{{ paciente.telefono if paciente else '' }}">

        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               value="{{ paciente.email if paciente else '' }}">

        <div class="form-actions">
            <button class="btn" type="submit">Guardar</button>
            <a class="btn btn-secondary" href="{{ url_for('index') }}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
